<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-labelledby="title desc">
  <title id="title">README Skills workflow</title>
  <desc id="desc">Repository evidence flows through inspection, mode and profile matching, claim validation, adaptive writing, and final checks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#020617" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1200" height="310" rx="28" fill="url(#bg)"/>
  <text x="60" y="58" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">Evidence → matched repository front door</text>
  <text x="60" y="88" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="16">One adaptive workflow; no universal README template.</text>
  <g font-family="Segoe UI, Arial, sans-serif" filter="url(#shadow)">
    <g transform="translate(55 125)">
      <rect width="180" height="120" rx="18" fill="#1e293b" stroke="#38bdf8"/>
      <text x="24" y="40" fill="#7dd3fc" font-size="14" font-weight="700">01 · INSPECT</text>
      <text x="24" y="70" fill="#f8fafc" font-size="18" font-weight="700">Repository truth</text>
      <text x="24" y="95" fill="#cbd5e1" font-size="13">Source · tests · CI · release</text>
    </g>
    <g transform="translate(280 125)">
      <rect width="180" height="120" rx="18" fill="#1e293b" stroke="#a78bfa"/>
      <text x="24" y="40" fill="#c4b5fd" font-size="14" font-weight="700">02 · MATCH</text>
      <text x="24" y="70" fill="#f8fafc" font-size="18" font-weight="700">Mode + profile</text>
      <text x="24" y="95" fill="#cbd5e1" font-size="13">Artifact · action · lifecycle</text>
    </g>
    <g transform="translate(505 125)">
      <rect width="180" height="120" rx="18" fill="#1e293b" stroke="#f59e0b"/>
      <text x="24" y="40" fill="#fcd34d" font-size="14" font-weight="700">03 · VERIFY</text>
      <text x="24" y="70" fill="#f8fafc" font-size="18" font-weight="700">Claim ledger</text>
      <text x="24" y="95" fill="#cbd5e1" font-size="13">Verified · inferred · missing</text>
    </g>
    <g transform="translate(730 125)">
      <rect width="180" height="120" rx="18" fill="#1e293b" stroke="#34d399"/>
      <text x="24" y="40" fill="#6ee7b7" font-size="14" font-weight="700">04 · COMPOSE</text>
      <text x="24" y="70" fill="#f8fafc" font-size="18" font-weight="700">Reader journey</text>
      <text x="24" y="95" fill="#cbd5e1" font-size="13">Identify · trust · act · learn</text>
    </g>
    <g transform="translate(955 125)">
      <rect width="190" height="120" rx="18" fill="#1e293b" stroke="#fb7185"/>
      <text x="24" y="40" fill="#fda4af" font-size="14" font-weight="700">05 · VALIDATE</text>
      <text x="24" y="70" fill="#f8fafc" font-size="18" font-weight="700">Rendered result</text>
      <text x="24" y="95" fill="#cbd5e1" font-size="13">Commands · links · assets</text>
    </g>
  </g>
  <g fill="#64748b">
    <path d="M247 185h21l-8-7 5-5 17 12-17 12-5-5 8-7h-21z"/>
    <path d="M472 185h21l-8-7 5-5 17 12-17 12-5-5 8-7h-21z"/>
    <path d="M697 185h21l-8-7 5-5 17 12-17 12-5-5 8-7h-21z"/>
    <path d="M922 185h21l-8-7 5-5 17 12-17 12-5-5 8-7h-21z"/>
  </g>
</svg>
